{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Compra - Supermercado Cataluña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'lista_productos' %}">🛒 SUPERMERCADO CATALUÑA</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 900px;">
    <div class="row g-5">
        
        <!-- Formulario de Datos -->
        <div class="col-md-7">
            <h3 class="fw-bold mb-4">Datos de Envío</h3>
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <form method="POST" action="{% url 'procesar_pedido' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small text-uppercase">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control form-control-lg bg-light border-0" required placeholder="Ej: Juan Pérez">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small text-uppercase">Dirección de Entrega</label>
                        <input type="text" name="direccion" class="form-control form-control-lg bg-light border-0" required placeholder="Ej: Calle 45 # 12-34, Barrio Centro">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted small text-uppercase">Método de Pago</label>
                        <select name="metodo_pago" class="form-select form-select-lg bg-light border-0" required>
                            <option value="Efectivo contra entrega">💵 Efectivo al recibir</option>
                            <option value="Transferencia (Nequi/Daviplata)">📱 Nequi / Daviplata</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-muted small text-uppercase">Notas Adicionales (Opcional)</label>
                        <textarea name="notas" class="form-control bg-light border-0" rows="2" placeholder="Ej: Traer vueltas de $50.000, timbre averiado..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                        <i class="bi bi-whatsapp me-2"></i> Enviar Pedido
                    </button>
                    <a href="{% url 'ver_carrito' %}" class="btn btn-link text-decoration-none text-muted w-100 text-center mt-3">Volver al carrito</a>
                </form>
            </div>
        </div>

        <!-- Resumen Lateral -->
        <div class="col-md-5">
            <div class="card bg-success text-white shadow-sm border-0 rounded-4 p-4 mt-2">
                <h5 class="fw-bold mb-3"><i class="bi bi-shield-check me-2"></i>Compra Segura</h5>
                <p class="small text-white-50 mb-4">Tu pedido será enviado directamente al WhatsApp del supermercado para atención inmediata.</p>
                <hr class="border-white-50">
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span class="fs-5">Total a Pagar</span>
                    <span class="fs-3 fw-bold">${{ total_general|floatformat:0 }}</span>
                </div>
            </div>
        </div>
        
    </div>
</div>

</body>
</html>
