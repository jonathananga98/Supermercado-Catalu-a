<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Supermercado Cataluña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h2 class="text-center fw-bold mb-4 text-dark">Iniciar Sesión</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 rounded-pill fw-semibold py-2 mt-3">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'lista_productos' %}" class="text-decoration-none text-muted small">← Volver al catálogo</a>
            </div>
        </div>
    </div>
</body>
</html>
