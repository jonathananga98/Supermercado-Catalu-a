<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Supermercado Cataluña</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container" style="max-width: 480px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Crear Cuenta</h3>
                <p class="text-muted small">Únete a Supermercado Cataluña</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <!-- Mostramos los campos del formulario de forma limpia -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors.0 }}
                            </div>
                        {% endif %}
                        {% if field.help_text %}
                            <div class="form-text text-muted" style="font-size: 0.75rem;">
                                {{ field.help_text|safe }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold py-2 mt-3 shadow-sm">
                    Registrarse
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'lista_productos' %}" class="text-decoration-none text-muted small">
                    ← Volver al catálogo de la tienda
                </a>
            </div>
        </div>
    </div>
</body>
</html>
